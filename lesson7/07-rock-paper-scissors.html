<!DOCTYPE html>
<html>

<head>
    <title>Rock Paper Scissors</title>
</head>

<body>
    <p>Rock Paper Scissors</p>


    <button onclick="
            playGame(`rock`);

        ">
        Rock
    </button>

    <button onclick="
      playGame(`paper`);

        ">
        Paper
    </button>

    <button onclick="
       playGame(`Scissors`);
        ">
        Scissors
    </button>


    <script>
        //    let computerMove = ''; // it can be acceessable 
        function pickComputerMove() {
            let computerMove = `` // can be accesseable if we return the values
            const randomNumber = Math.random();

            if (randomNumber >= 0 && randomNumber < 1 / 3) {
                computerMove = `rock`
            }
            else if (randomNumber >= 1 / 3 && randomNumber < 2 / 3) {
                computerMove = `paper`
            }
            else if (randomNumber >= 2 / 3 && randomNumber < 1) {
                computerMove = 'Scissors'
            }
            return computerMove;
        }


        function playGame(playerMove) {
            const computerMove = pickComputerMove();

            let result = '';
            if (playerMove === `Scissors`) {
                if (computerMove === 'rock') {
                    result = 'You lose.'
                }
                else if (computerMove === 'paper') {
                    result = 'You win.'
                }
                else if (computerMove === 'Scissors') {
                    result = 'Tie.'
                }

            }

            else if (playerMove === `paper`) {
                if (computerMove === 'rock') {
                    result = 'You win.'
                }
                else if (computerMove === 'paper') {
                    result = 'Tie.'
                }
                else if (computerMove === 'Scissors') {
                    result = 'You lose.'
                }

            }

            else if (playerMove === `rock`) {
                if (computerMove === 'rock') {
                    result = 'Tie.'
                }
                else if (computerMove === 'paper') {
                    result = 'You lose.'
                }
                else if (computerMove === 'Scissors') {
                    result = 'You win.'
                }
            }


            alert(`You  Picked ${playerMove} rock .computer picked  ${computerMove}.${result}`);


        }

    </script>
</body>

</html>
